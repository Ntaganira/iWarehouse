services:
  postgres:
    image: postgres:16-alpine
    container_name: iwarehouse-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"   # DB_PORT=5441 when another project already uses 5432
    environment:
      POSTGRES_DB: iwarehouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Africa/Kigali
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: iwarehouse-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"             # MINIO_PORT=9010 when another project already uses 9000 (then MINIO_URL=http://localhost:9010)
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
