<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--/* Digital receipt sharing: a Share button beside Print/PDF, and the sheet that sends the public link.
       The button carries the document's type and id; the link is made when it is pressed, never by opening
       the page, and the public address is the token alone. */-->
<th:block th:fragment="share(type, documentId, label)">
    <button type="button" class="btn btn-outline share-trigger"
            th:attr="data-share-type=${type},data-share-id=${documentId},data-share-csrf=${_csrf.token},data-share-failed=#{share.failed}"
            th:title="#{share.buttonTitle}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
        </svg>
        <span th:text="${label}">Share receipt</span>
    </button>

    <div class="modal-overlay" id="share-modal" role="dialog" aria-modal="true" aria-labelledby="share-modal-title"
         th:attr="data-share-pdf-failed=#{share.pdfFailed},data-share-attach=#{share.attachPdf}">
        <div class="modal share-modal">
            <div class="modal-header">
                <h3 id="share-modal-title" th:text="#{share.title}">Share this document</h3>
                <button type="button" class="modal-close" data-modal-close="share-modal"
                        th:aria-label="#{common.close}">&times;</button>
            </div>
            <div class="modal-body">
                <p class="text-muted" data-share-intro th:text="#{share.loading}">Preparing the secure link...</p>

                <div class="share-channels">
                    <button type="button" class="share-channel is-whatsapp" data-share-whatsapp>
                        <span class="share-channel-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.15h-.01a8.23 8.23 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.83 2.41a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.23-8.23 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.16.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.37-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"></path>
                            </svg>
                        </span>
                        <span class="share-channel-text">
                            <strong>WhatsApp</strong>
                            <small th:text="#{share.whatsappHint}">Send the PDF on WhatsApp.</small>
                        </span>
                        <svg class="share-channel-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                        <span class="share-channel-loading" aria-hidden="true"><span class="spinner"></span></span>
                    </button>

                    <button type="button" class="share-channel" data-share-native
                            th:attr="data-share-copied=#{share.copied}">
                        <span class="share-channel-icon is-neutral">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="18" cy="5" r="3"></circle>
                                <circle cx="6" cy="12" r="3"></circle>
                                <circle cx="18" cy="19" r="3"></circle>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                            </svg>
                        </span>
                        <span class="share-channel-text">
                            <strong th:text="#{share.more}">More options</strong>
                            <small th:text="#{share.moreHint}">Send the PDF by SMS, email or any app.</small>
                        </span>
                        <svg class="share-channel-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                        <span class="share-channel-loading" aria-hidden="true"><span class="spinner"></span></span>
                    </button>

                    <button type="button" class="share-channel" data-share-copy
                            th:attr="data-share-copied=#{share.copied}">
                        <span class="share-channel-icon is-neutral">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="9" y="9" width="13" height="13" rx="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </span>
                        <span class="share-channel-text">
                            <strong th:text="#{share.copy}">Copy link</strong>
                            <small th:text="#{share.copyHint}">Copy the secure link.</small>
                        </span>
                    </button>
                </div>

                <div class="share-link">
                    <label for="share-link-input" th:text="#{share.link}">Public link</label>
                    <div class="share-link-row">
                        <input id="share-link-input" type="text" readonly data-share-url
                               onfocus="this.select()">
                        <button type="button" class="btn btn-outline btn-sm" data-share-copy
                                th:attr="data-share-copied=#{share.copied}" th:text="#{share.copyShort}">Copy</button>
                    </div>
                    <p class="hint" th:text="#{share.linkHint}">Anyone with this link can read the document.</p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" data-modal-close="share-modal"
                        th:text="#{common.close}">Close</button>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
