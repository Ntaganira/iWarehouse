<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<!--/*
  Page numbers under every table that lists records, shown as soon as it has rows ("1 - 3 / 3" and page 1).
  pager(page, baseUrl, query): query is "a=1&b=2" without a leading "?" (may be empty); the page goes in "page".
  pagerParam(page, baseUrl, query, pageParam): the same with its own parameter, for a second paged table on a page.
*/-->
<div th:fragment="pager(page, baseUrl, query)" th:remove="tag">
    <th:block th:replace="~{layout/pagination :: pagerParam(${page}, ${baseUrl}, ${query}, 'page')}"></th:block>
</div>

<div th:fragment="pagerParam(page, baseUrl, query, pageParam)"
     th:with="prefix=${baseUrl + '?' + (query == null or query == '' ? '' : query + '&') + pageParam + '='}" th:remove="tag">
    <div class="pagination" th:if="${page.totalElements > 0}">
        <span class="info"
              th:text="|${#numbers.formatInteger(page.number * page.size + 1, 1, 'COMMA')} - ${#numbers.formatInteger(page.number * page.size + page.numberOfElements, 1, 'COMMA')} / ${#numbers.formatInteger(page.totalElements, 1, 'COMMA')}|">1 - 8 / 12</span>
        <a th:href="${prefix + 0}" th:classappend="${page.first} ? 'disabled'" th:title="#{pag.first}" th:aria-label="#{pag.first}">«</a>
        <a th:href="${prefix + (page.number - 1)}" th:classappend="${page.first} ? 'disabled'" th:title="#{pag.prev}" th:aria-label="#{pag.prev}">‹</a>
        <a th:each="i : ${@paginationHelper.window(page.number, page.totalPages, 2)}"
           th:href="${prefix + i}" th:text="${i + 1}" th:classappend="${i == page.number} ? 'active'"
           th:attr="aria-current=${i == page.number} ? 'page' : null">1</a>
        <a th:href="${prefix + (page.number + 1)}" th:classappend="${page.last} ? 'disabled'" th:title="#{pag.next}" th:aria-label="#{pag.next}">›</a>
        <a th:href="${prefix + (page.totalPages - 1)}" th:classappend="${page.last} ? 'disabled'" th:title="#{pag.last}" th:aria-label="#{pag.last}">»</a>
    </div>
</div>
</body>
</html>
