<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(#{employee.title}, ~{::content})}">
<head><title>Employees - iWarehouse</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 th:text="#{employee.title}">Employees</h1>
            <div class="subtitle" th:text="#{employee.subtitle(${activeCount})}">12 employees paid each month</div>
        </div>
        <a href="/payroll/employees/new" class="btn btn-primary" sec:authorize="hasAuthority('PERM_MANAGE_EMPLOYEE') and hasAuthority('PERM_VIEW_EMPLOYEE_DATA')">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span th:text="#{employee.add}">Add employee</span>
        </a>
    </div>

    <div class="section">
        <div class="section-header">
            <h2>
                <span th:text="#{employee.sectionTitle}">Employees</span>
                <span class="section-count" th:text="${employees.totalElements}">0</span>
            </h2>
            <form th:action="@{/payroll/employees}" method="get" class="table-toolbar party-filters">
                <div class="toolbar-search">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" name="search" th:value="${search}" th:placeholder="#{employee.searchPh}" th:aria-label="#{employee.searchPh}">
                </div>
                <select name="status" class="toolbar-filter" onchange="this.form.submit()" th:aria-label="#{common.status}">
                    <option value="" th:selected="${status == null or status == ''}" th:text="#{common.allStatus}">All statuses</option>
                    <option value="active" th:selected="${status == 'active'}" th:text="#{employee.status.active}">Working</option>
                    <option value="left" th:selected="${status == 'left'}" th:text="#{employee.status.left}">Left</option>
                </select>
            </form>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th th:text="#{employee.code}">Code</th>
                        <th th:text="#{employee.fullName}">Name</th>
                        <th th:text="#{employee.jobTitle}">Job title</th>
                        <th class="num" th:text="#{employee.monthlyPay}">Monthly pay (RWF)</th>
                        <th th:text="#{employee.payMethod}">Paid by</th>
                        <th th:text="#{common.status}">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e : ${employees.content}">
                        <td><a class="row-link strong mono" th:href="@{/payroll/employees/{id}(id=${e.id})}" th:text="${e.code}">EMP-WH-0001</a></td>
                        <td>
                            <span th:text="${e.fullName}">Jean Habimana</span>
                            <div class="cell-sub" th:if="${e.user != null}" th:text="${e.user.username}">jhabimana</div>
                        </td>
                        <td th:text="${e.jobTitle != null} ? ${e.jobTitle} : '—'">Cutter</td>
                        <td class="num" th:text="${@num.money(e.monthlyPay)}">300,000</td>
                        <td th:text="#{${'employee.payMethod.' + e.payMethod}}">Bank</td>
                        <td><th:block th:replace="~{payroll/employees/list :: employeeStatus(${e})}"></th:block></td>
                    </tr>
                    <tr th:if="${employees.totalElements == 0}">
                        <td colspan="6">
                            <div class="empty-state">
                                <h3 th:text="#{employee.empty}">No employees yet</h3>
                                <p th:text="#{employee.emptyHint}">Add the people the business pays: their salary, allowances and account</p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <th:block th:replace="~{layout/pagination :: pager(${employees}, '/payroll/employees', ${paginationQuery})}"></th:block>
    </div>
</div>

<!--/* Working, or left on a day */-->
<th:block th:fragment="employeeStatus(e)">
    <span th:if="${e.leftOn == null}" class="badge badge-success" th:text="#{employee.status.active}">Working</span>
    <span th:if="${e.leftOn != null}" class="badge badge-secondary" th:text="#{employee.leftShort(${#temporals.format(e.leftOn, 'dd/MM/yyyy')})}">Left 30/09/2026</span>
</th:block>
</body>
</html>
