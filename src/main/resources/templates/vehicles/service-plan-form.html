<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/sidebar :: html(${plan == null} ? #{servicePlan.new} : #{servicePlan.edit}, ~{::content})}">
<head><title>Service plan - iWarehouse</title></head>
<body>
<div th:fragment="content" th:with="back=${'/vehicles/' + vehicle.id + '?tab=service'}">
    <div class="page-header">
        <div>
            <h1 th:text="${plan == null} ? #{servicePlan.new} : #{servicePlan.edit}">New service plan</h1>
            <div class="subtitle" th:text="#{servicePlan.subtitle(${vehicle.plate}, ${vehicle.model})}">RAC123A · Isuzu NPR: work it needs regularly</div>
        </div>
        <a th:href="${back}" class="btn btn-outline" th:text="#{common.back}">Back</a>
    </div>

    <div class="section">
        <form th:action="${plan == null} ? @{/vehicles/{v}/service-plans/new(v=${vehicle.id})} : @{/vehicles/{v}/service-plans/{p}/edit(v=${vehicle.id}, p=${plan.id})}"
              th:object="${planDto}" method="post" class="form-container" novalidate>
            <div th:replace="~{layout/errors :: error-summary}"></div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label for="name" th:text="#{servicePlan.name}">Name</label>
                    <input type="text" id="name" th:field="*{name}" maxlength="60" required th:placeholder="#{servicePlan.namePh}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>
                <div class="form-group">
                    <label for="everyKm" th:text="#{servicePlan.everyKm}">Every</label>
                    <div class="input-unit">
                        <input type="number" id="everyKm" th:field="*{everyKm}" step="1" min="100" max="200000" inputmode="numeric"
                               th:classappend="${#fields.hasErrors('everyKm')} ? 'is-invalid'">
                        <span>km</span>
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('everyKm')}" th:errors="*{everyKm}"></span>
                </div>
                <div class="form-group">
                    <label for="everyMonths" th:text="#{servicePlan.everyMonths}">Or every</label>
                    <div class="input-unit">
                        <input type="number" id="everyMonths" th:field="*{everyMonths}" step="1" min="1" max="60" inputmode="numeric"
                               th:classappend="${#fields.hasErrors('everyMonths')} ? 'is-invalid'">
                        <span th:text="#{servicePlan.unit.months}">months</span>
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('everyMonths')}" th:errors="*{everyMonths}"></span>
                    <span class="hint" th:text="#{servicePlan.everyHint}">Whichever comes first; give one or both</span>
                </div>
                <div class="form-group">
                    <label for="lastDoneOn" th:text="#{servicePlan.lastDoneOn}">Last done on</label>
                    <input type="date" id="lastDoneOn" th:field="*{lastDoneOn}" required th:attr="max=${today}"
                           th:classappend="${#fields.hasErrors('lastDoneOn')} ? 'is-invalid'">
                    <span class="field-error" th:if="${#fields.hasErrors('lastDoneOn')}" th:errors="*{lastDoneOn}"></span>
                </div>
                <div class="form-group">
                    <label for="lastDoneKm" th:text="#{servicePlan.lastDoneKm}">At</label>
                    <div class="input-unit">
                        <input type="number" id="lastDoneKm" th:field="*{lastDoneKm}" step="1" min="0" inputmode="numeric"
                               th:classappend="${#fields.hasErrors('lastDoneKm')} ? 'is-invalid'">
                        <span>km</span>
                    </div>
                    <span class="field-error" th:if="${#fields.hasErrors('lastDoneKm')}" th:errors="*{lastDoneKm}"></span>
                    <span class="hint" th:text="#{servicePlan.lastDoneKmHint}">Empty: the vehicle's latest reading</span>
                </div>
                <div class="form-group full-width">
                    <label for="note" th:text="#{servicePlan.note}">Note</label>
                    <input type="text" id="note" th:field="*{note}" maxlength="255" th:placeholder="#{servicePlan.notePh}"
                           th:classappend="${#fields.hasErrors('note')} ? 'is-invalid'">
                    <span class="field-error" th:if="${#fields.hasErrors('note')}" th:errors="*{note}"></span>
                </div>
            </div>
            <p class="form-note" th:text="#{servicePlan.formNote}">Record the work as a vehicle cost and choose this plan: it then counts again from that day and odometer.</p>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="#{servicePlan.save}">Save the plan</button>
                <a th:href="${back}" class="btn btn-outline" th:text="#{common.cancel}">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
